<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Animal & Plant Finder</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  padding: 15px;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
  background: linear-gradient(135deg, #635bff, #00c6ff);
  color: white;
}

.topbar {
  max-width: 520px;
  margin: 0 auto 20px;
  display: flex;
  justify-content: space-between;
  gap: 8px;
}

button {
  border: 0;
  cursor: pointer;
  font-weight: bold;
  -webkit-tap-highlight-color: transparent;
}

.category {
  display: flex;
  gap: 7px;
}

.tab,
.language {
  padding: 11px 13px;
  border-radius: 14px;
  color: white;
  background: rgba(255,255,255,.2);
  font-size: 14px;
}

.tab.active {
  background: white;
  color: #5147e8;
}

.container {
  width: 100%;
  max-width: 520px;
  margin: auto;
  text-align: center;
}

h1 {
  font-size: 34px;
  margin: 10px 0;
}

.subtitle {
  margin-bottom: 22px;
  opacity: .9;
}

.card {
  padding: 22px;
  border-radius: 28px;
  background: rgba(255,255,255,.17);
  border: 1px solid rgba(255,255,255,.3);
  backdrop-filter: blur(15px);
  box-shadow: 0 15px 40px rgba(0,0,0,.2);
}

input {
  width: 100%;
  height: 75px;
  border: 0;
  outline: 0;
  border-radius: 20px;
  background: white;
  color: #222;
  text-align: center;
  font-size: 38px;
  font-weight: bold;
  margin-bottom: 14px;
}

.random {
  width: 100%;
  height: 55px;
  border-radius: 17px;
  background: white;
  color: #5147e8;
  font-size: 17px;
}

.result {
  min-height: 220px;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
}

.emoji {
  font-size: 80px;
}

.name {
  margin-top: 8px;
  font-size: 32px;
  font-weight: bold;
}

.info {
  margin-top: 7px;
  opacity: .8;
}

@media (max-width: 400px) {
  .tab,
  .language {
    padding: 10px 9px;
    font-size: 12px;
  }

  h1 {
    font-size: 30px;
  }
}
</style>
</head>

<body>

<div class="topbar">

  <div class="category">

    <button id="animalsBtn" class="tab active">
      🐾 Animals
    </button>

    <button id="plantsBtn" class="tab">
      🌱 Plants
    </button>

  </div>

  <button id="languageBtn" class="language">
    العربية 🇸🇦
  </button>

</div>

<div class="container">

  <h1 id="title">🐾 Animal Finder</h1>

  <p id="subtitle" class="subtitle">
    Type a letter and discover an animal!
  </p>

  <div class="card">

    <input
      id="letterInput"
      type="text"
      maxlength="1"
      autocomplete="off"
      autocorrect="off"
      spellcheck="false"
      placeholder="A"
    >

    <button id="randomBtn" class="random">
      🎲 Random Animal
    </button>

    <div id="result" class="result">

      <div class="emoji">🐾</div>

      <div class="name">
        Type a letter!
      </div>

      <div class="info">
        A - Z
      </div>

    </div>

  </div>

</div>

<script>

/* =========================
   SETTINGS
========================= */

let language = "en";
let category = "animals";


/* =========================
   ENGLISH ANIMALS
========================= */

const englishAnimals = {
  A:["Alligator","🐊"],
  B:["Bear","🐻"],
  C:["Cat","🐱"],
  D:["Dog","🐶"],
  E:["Elephant","🐘"],
  F:["Fox","🦊"],
  G:["Giraffe","🦒"],
  H:["Horse","🐴"],
  I:["Iguana","🦎"],
  J:["Jaguar","🐆"],
  K:["Kangaroo","🦘"],
  L:["Lion","🦁"],
  M:["Monkey","🐒"],
  N:["Narwhal","🐋"],
  O:["Owl","🦉"],
  P:["Penguin","🐧"],
  Q:["Quail","🐦"],
  R:["Rabbit","🐰"],
  S:["Snake","🐍"],
  T:["Tiger","🐯"],
  U:["Urial","🐏"],
  V:["Vulture","🦅"],
  W:["Wolf","🐺"],
  X:["X-ray Tetra","🐟"],
  Y:["Yak","🐂"],
  Z:["Zebra","🦓"]
};


/* =========================
   ARABIC ANIMALS
========================= */

const arabicAnimals = {
  "ا":["أسد","🦁"],
  "ب":["بطة","🦆"],
  "ت":["تمساح","🐊"],
  "ث":["ثعلب","🦊"],
  "ج":["جمل","🐪"],
  "ح":["حصان","🐴"],
  "خ":["خروف","🐑"],
  "د":["دب","🐻"],
  "ذ":["ذئب","🐺"],
  "ر":["راكون","🦝"],
  "ز":["زرافة","🦒"],
  "س":["سمكة","🐟"],
  "ش":["شمبانزي","🐒"],
  "ص":["صقر","🦅"],
  "ض":["ضبع","🐕"],
  "ط":["طاووس","🦚"],
  "ظ":["ظبي","🦌"],
  "ع":["عقاب","🦅"],
  "غ":["غزال","🦌"],
  "ف":["فيل","🐘"],
  "ق":["قرد","🐒"],
  "ك":["كلب","🐶"],
  "ل":["ليمور","🐒"],
  "م":["ماعز","🐐"],
  "ن":["نمر","🐯"],
  "ه":["هدهد","🐦"],
  "و":["وحيد القرن","🦏"],
  "ي":["يمامة","🕊️"]
};


/* =========================
   ENGLISH PLANTS
========================= */

const englishPlants = {
  A:["Apple Tree","🍎"],
  B:["Bamboo","🎋"],
  C:["Cactus","🌵"],
  D:["Daisy","🌼"],
  E:["Eucalyptus","🌿"],
  F:["Fern","🌿"],
  G:["Grapevine","🍇"],
  H:["Hibiscus","🌺"],
  I:["Iris","🌸"],
  J:["Jasmine","🌼"],
  K:["Kale","🥬"],
  L:["Lavender","💜"],
  M:["Maple Tree","🍁"],
  N:["Nettle","🌿"],
  O:["Oak Tree","🌳"],
  P:["Pine Tree","🌲"],
  Q:["Quince","🍐"],
  R:["Rose","🌹"],
  S:["Sunflower","🌻"],
  T:["Tulip","🌷"],
  U:["Umbrella Plant","🌿"],
  V:["Violet","💜"],
  W:["Water Lily","🪷"],
  X:["Xerophyte","🌵"],
  Y:["Yarrow","🌿"],
  Z:["Zinnia","🌸"]
};


/* =========================
   ARABIC PLANTS
========================= */

const arabicPlants = {
  "ا":["أرز","🌲"],
  "ب":["بابونج","🌼"],
  "ت":["تفاح","🍎"],
  "ث":["ثوم","🧄"],
  "ج":["جوز","🌰"],
  "ح":["حبق","🌿"],
  "خ":["خزامى","💜"],
  "د":["دوار الشمس","🌻"],
  "ذ":["ذرة","🌽"],
  "ر":["رمان","🍎"],
  "ز":["زيتون","🫒"],
  "س":["سنابل","🌾"],
  "ش":["شجرة","🌳"],
  "ص":["صبار","🌵"],
  "ض":["ضرو","🌿"],
  "ط":["طحالب","🌿"],
  "ظ":["ظلية","🌿"],
  "ع":["عنب","🍇"],
  "غ":["غار","🌿"],
  "ف":["فراولة","🍓"],
  "ق":["قرنفل","🌸"],
  "ك":["كركديه","🌺"],
  "ل":["ليمون","🍋"],
  "م":["موز","🍌"],
  "ن":["نخيل","🌴"],
  "ه":["هندباء","🌼"],
  "و":["ورد","🌹"],
  "ي":["ياسمين","🌼"]
};


/* =========================
   GET ELEMENTS
========================= */

const animalsBtn = document.getElementById("animalsBtn");
const plantsBtn = document.getElementById("plantsBtn");
const languageBtn = document.getElementById("languageBtn");
const randomBtn = document.getElementById("randomBtn");

const letterInput = document.getElementById("letterInput");
const result = document.getElementById("result");

const title = document.getElementById("title");
const subtitle = document.getElementById("subtitle");


/* =========================
   GET CURRENT DATA
========================= */

function getData() {

  if (category === "animals") {

    if (language === "en") {
      return englishAnimals;
    }

    return arabicAnimals;

  }

  if (language === "en") {
    return englishPlants;
  }

  return arabicPlants;
}


/* =========================
   DISPLAY RESULT
========================= */

function showResult(letter) {

  const data = getData();

  if (!letter) {

    if (language === "en") {

      result.innerHTML = `
        <div class="emoji">
          ${category === "animals" ? "🐾" : "🌱"}
        </div>

        <div class="name">
          Type a letter!
        </div>

        <div class="info">
          A - Z
        </div>
      `;

    } else {

      result.innerHTML = `
        <div class="emoji">
          ${category === "animals" ? "🐾" : "🌱"}
        </div>

        <div class="name">
          اكتب حرفًا!
        </div>

        <div class="info">
          ا - ي
        </div>
      `;

    }

    return;
  }


  if (data[letter]) {

    const item = data[letter];

    result.innerHTML = `
      <div class="emoji">
        ${item[1]}
      </div>

      <div class="name">
        ${item[0]}
      </div>

      <div class="info">
        ${
          language === "en"
          ? (
              category === "animals"
              ? "Animal starting with "
              : "Plant starting with "
            ) + letter
          : (
              category === "animals"
              ? "حيوان يبدأ بحرف "
              : "نبات يبدأ بحرف "
            ) + letter
        }
      </div>
    `;

  } else {

    result.innerHTML = `
      <div class="emoji">❓</div>

      <div class="name">
        ${
          language === "en"
          ? "No result"
          : "لا توجد نتيجة"
        }
      </div>
    `;
  }
}


/* =========================
   INPUT
========================= */

letterInput.addEventListener("input", function() {

  let letter = letterInput.value.trim();

  if (language === "en") {
    letter = letter.toUpperCase();
  }

  letterInput.value = letter;

  showResult(letter);

});


/* =========================
   LANGUAGE
========================= */

languageBtn.addEventListener("click", function() {

  if (language === "en") {

    language = "ar";

    document.documentElement.lang = "ar";
    document.documentElement.dir = "rtl";

    languageBtn.textContent = "English 🇬🇧";

  } else {

    language = "en";

    document.documentElement.lang = "en";
    document.documentElement.dir = "ltr";

    languageBtn.textContent = "العربية 🇸🇦";
  }

  letterInput.value = "";

  updateText();

  showResult("");

});


/* =========================
   ANIMALS
========================= */

animalsBtn.addEventListener("click", function() {

  category = "animals";

  animalsBtn.classList.add("active");
  plantsBtn.classList.remove("active");

  letterInput.value = "";

  updateText();

  showResult("");

});


/* =========================
   PLANTS
========================= */

plantsBtn.addEventListener("click", function() {

  category = "plants";

  plantsBtn.classList.add("active");
  animalsBtn.classList.remove("active");

  letterInput.value = "";

  updateText();

  showResult("");

});


/* =========================
   UPDATE TEXT
========================= */

function updateText() {

  if (language === "en") {

    animalsBtn.textContent = "🐾 Animals";
    plantsBtn.textContent = "🌱 Plants";

    if (category === "animals") {

      title.textContent = "🐾 Animal Finder";

      subtitle.textContent =
        "Type a letter and discover an animal!";

      randomBtn.textContent =
        "🎲 Random Animal";

    } else {

      title.textContent = "🌱 Plant Finder";

      subtitle.textContent =
        "Type a letter and discover a plant!";

      randomBtn.textContent =
        "🎲 Random Plant";
    }

    letterInput.placeholder = "A";

  } else {

    animalsBtn.textContent = "🐾 الحيوانات";
    plantsBtn.textContent = "🌱 النباتات";

    if (category === "animals") {

      title.textContent = "🐾 مكتشف الحيوانات";

      subtitle.textContent =
        "اكتب حرفًا واكتشف حيوانًا!";

      randomBtn.textContent =
        "🎲 حيوان عشوائي";

    } else {

      title.textContent = "🌱 مكتشف النباتات";

      subtitle.textContent =
        "اكتب حرفًا واكتشف نباتًا!";

      randomBtn.textContent =
        "🎲 نبات عشوائي";
    }

    letterInput.placeholder = "ا";
  }
}


/* =========================
   RANDOM
========================= */

randomBtn.addEventListener("click", function() {

  const data = getData();

  const letters = Object.keys(data);

  const randomLetter =
    letters[Math.floor(Math.random() * letters.length)];

  letterInput.value = randomLetter;

  showResult(randomLetter);

});


/* START */

updateText();
showResult("");

</script>

</body>
</html>
